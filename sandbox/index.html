<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leasing Lab — Tenant Turner practice workspace</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="replica.css?v=recorded-layout" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

    <!-- Fixed Dark Navy Sidebar (#1A252F) -->
    <aside id="sidebar" class="sidebar" aria-label="Tenant Turner Navigation">
      <div class="tt-logo-wrap">
        <button id="logoHomeBtn" class="tt-logo" type="button" title="Tenant Turner — Rentals">
          <svg width="30" height="30" viewBox="0 0 32 32" fill="none">
            <path d="M4 15L16 5L28 15" stroke="#EF6C00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M8 14V26H24V14" fill="#43A047"/>
            <text x="16" y="23.5" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-weight="700" font-size="10">TT</text>
          </svg>
        </button>
      </div>
      <nav id="navStack" class="nav-stack"></nav>
    </aside>

    <!-- Main Workspace -->
    <div class="main-col">
      <header id="topHeader" class="top-header"></header>
      <aside id="practice-guide" class="practice-guide" aria-label="Practice tutorial" hidden></aside>
      <main id="canvas" class="canvas"></main>
    </div>
  </div>

  <!-- Bottom-Right Intercom-Style Chat Widget -->
  <button id="chatFab" class="chat-fab" type="button" aria-label="Practice helper chat">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
      <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
    </svg>
  </button>

  <div id="chatPopover" class="chat-popover" role="dialog" aria-label="Practice Support">
    <div class="chat-pop-head">
      <span>Leasing Lab Practice</span>
      <button id="closeChatBtn" type="button" style="border:0;background:transparent;color:#fff;font-size:18px;cursor:pointer;">×</button>
    </div>
    <div class="chat-pop-body">
      <div id="practice-support-thread" class="practice-support-thread" aria-live="polite"></div>
      <form id="practice-support"><label class="mat-field"><span class="mat-label">Practice support message</span><input id="practice-support-message" class="mat-input" required></label><button class="btn-blue" type="submit">Send practice message</button></form>
    </div>
  </div>


  <!-- Reusable Modal for Device Codes / Add Device / Schedule Showing -->
  <div id="ttModal" class="modal-backdrop" role="dialog" aria-labelledby="ttModalTitle" aria-modal="true" aria-hidden="true">
    <div class="modal-box">
      <div class="modal-head">
        <span id="ttModalTitle">Details</span>
        <button id="ttModalClose" type="button" aria-label="Close dialog" style="border:0;background:transparent;color:#fff;font-size:20px;cursor:pointer;">×</button>
      </div>
      <div id="ttModalBody" class="modal-body"></div>
      <div id="ttModalFoot" class="modal-foot"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="signoutOverlay" class="signout-overlay" role="dialog" aria-label="Practice session paused" aria-modal="true" aria-hidden="true">
    <div class="signout-card">
      <div class="signout-logo-circle">
        <svg width="34" height="34" viewBox="0 0 32 32" fill="none">
          <path d="M4 15L16 5L28 15" stroke="#EF6C00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8 14V25H24V14" stroke="#0277BD" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="13.5" y="17.5" width="5" height="7.5" fill="#EF6C00" rx="0.8"/>
        </svg>
      </div>
      <h2 style="margin:0 0 4px; font-size:20px; color:#263238;">Return to Leasing Lab</h2>
      <p style="margin:0 0 20px; font-size:13px; color:#607D8B;">Your fictional records and tutorial progress are saved on this browser.</p>
      <button id="signBackInBtn" class="btn-blue" type="button" style="width:100%; padding:11px 16px; font-size:14px;">Return to practice</button>
    </div>
  </div>

  <script src="data.js?v=recorded-layout"></script>
  <script src="scheduling.js?v=recorded-layout"></script>
  <script src="exports.js?v=recorded-layout"></script>
  <script src="replica-booking.js?v=recorded-layout"></script>
  <script src="replica-workflows.js?v=recorded-layout"></script>
  <script src="full-workspace.js?v=recorded-layout"></script>
  <script src="replica-tutorial.js?v=recorded-layout"></script>
  <script src="replica.js?v=recorded-layout"></script>
</body>
</html>
