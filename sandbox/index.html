<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leasing Lab | Rental operations practice</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="assets/lab.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="replica.css?v=prospect-review" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

    <aside id="sidebar" class="sidebar" aria-label="Leasing Lab navigation">
      <div class="tt-logo-wrap">
        <button id="logoHomeBtn" class="tt-logo" type="button" aria-label="Leasing Lab home" title="Leasing Lab">
          <img src="assets/lab.svg" width="34" height="34" alt="">
        </button>
      </div>
      <nav id="navStack" class="nav-stack"></nav>
    </aside>

    <!-- Main Workspace -->
    <div class="main-col">
      <header id="topHeader" class="top-header"></header>
      <aside id="practice-guide" class="practice-guide" aria-label="Practice tutorial" hidden></aside>
      <main id="canvas" class="canvas"></main>
    </div>
  </div>

  <button id="chatFab" class="chat-fab" type="button" aria-label="Practice helper chat" aria-controls="chatPopover" aria-expanded="false">
    <svg class="chat-open-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <path d="M5 5h14v12H9l-4 4z M8 9h8m-8 4h5"/>
    </svg>
    <svg class="chat-close-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    <span>Help</span>
  </button>

  <aside id="chatPopover" class="chat-popover" aria-labelledby="practice-help-heading">
    <div class="chat-pop-head">
      <div><h2 id="practice-help-heading">Leasing Lab support</h2><span>Local practice session</span></div>
      <button id="closeChatBtn" type="button" aria-label="Close practice support">×</button>
    </div>
    <div class="chat-pop-body">
      <section aria-labelledby="support-answers-title">
        <h3 id="support-answers-title">Find an answer</h3>
        <label class="mat-field"><span class="mat-label">Search help topics</span><input id="practice-support-search" class="mat-input" type="search"></label>
        <div id="practice-support-results"></div>
      </section>
      <section aria-labelledby="support-history-title">
        <h3 id="support-history-title">Conversation history</h3>
        <div id="practice-support-thread" class="practice-support-thread" aria-live="polite"></div>
        <form id="practice-support"><label class="mat-field"><span class="mat-label">Practice support message</span><input id="practice-support-message" class="mat-input" maxlength="500" required></label><button class="btn-blue" type="submit">Send practice message</button></form>
      </section>
    </div>
  </aside>


  <!-- Reusable Modal for Device Codes / Add Device / Schedule Showing -->
  <div id="ttModal" class="modal-backdrop" role="dialog" aria-labelledby="ttModalTitle" aria-modal="true" aria-hidden="true">
    <div class="modal-box">
      <div class="modal-head">
        <span id="ttModalTitle">Details</span>
        <button id="ttModalClose" type="button" aria-label="Close dialog" style="border:0;background:transparent;color:#fff;font-size:20px;cursor:pointer;">×</button>
      </div>
      <div id="ttModalBody" class="modal-body"></div>
      <div id="ttModalFoot" class="modal-foot"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="signoutOverlay" class="signout-overlay" role="dialog" aria-label="Practice session paused" aria-modal="true" aria-hidden="true">
    <div class="signout-card">
      <div class="signout-logo-circle">
        <img src="assets/lab.svg" width="34" height="34" alt="">
      </div>
      <h2 style="margin:0 0 4px; font-size:20px; color:#263238;">Return to Leasing Lab</h2>
      <p style="margin:0 0 20px; font-size:13px; color:#607D8B;">Your fictional records and tutorial progress are saved on this browser.</p>
      <button id="signBackInBtn" class="btn-blue" type="button" style="width:100%; padding:11px 16px; font-size:14px;">Return to practice</button>
    </div>
  </div>

  <script src="data.js?v=prospect-review"></script>
  <script src="scheduling.js?v=prospect-review"></script>
  <script src="exports.js?v=prospect-review"></script>
  <script src="replica-booking.js?v=prospect-review"></script>
  <script src="replica-workflows.js?v=prospect-review"></script>
  <script src="full-workspace.js?v=prospect-review"></script>
  <script src="replica-tutorial.js?v=prospect-review"></script>
  <script src="replica.js?v=prospect-review"></script>
</body>
</html>
